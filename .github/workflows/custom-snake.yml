name: Colorful Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Snake GIF
        run: |
          mkdir -p output

          cat > snake.py <<'PY'
          from PIL import Image, ImageDraw
          import math

          # ==============================
          # SIZE
          # ==============================
          WIDTH = 1200
          HEIGHT = 260

          COLS = 48
          ROWS = 7

          DOT = 14
          GAP_X = 9
          GAP_Y = 9

          START_X = 45
          START_Y = 35

          BACKGROUND = (7, 12, 25)

          # GitHub-style dark colorful palette
          COLORS = [
              (25, 22, 70),       # dark purple
              (49, 46, 129),      # indigo
              (124, 58, 237),     # purple
              (6, 182, 212),     # cyan
              (236, 72, 153),     # pink
          ]

          SNAKE = (244, 114, 182)
          SNAKE_GLOW = (168, 85, 247)

          # ==============================
          # CREATE SNAKE PATH
          # ==============================

          path = []

          for row in range(ROWS):

              if row % 2 == 0:
                  columns = range(COLS)
              else:
                  columns = range(COLS - 1, -1, -1)

              for col in columns:
                  path.append((row, col))

          # ==============================
          # DOT POSITION
          # ==============================

          def position(row, col):
              x = START_X + col * (DOT + GAP_X)
              y = START_Y + row * (DOT + GAP_Y)

              return x, y

          # ==============================
          # FRAMES
          # ==============================

          frames = []

          # One block at a time
          for step in range(len(path)):

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BACKGROUND
              )

              draw = ImageDraw.Draw(image)

              # ==========================
              # DRAW GRID
              # ==========================

              for i, (row, col) in enumerate(path):

                  x, y = position(row, col)

                  if i < step:
                      # EATEN BLOCK
                      color = (10, 16, 30)
                  else:
                      # COLOURFUL BLOCK
                      color = COLORS[(row * 2 + col) % len(COLORS)]

                  draw.rounded_rectangle(
                      [
                          x,
                          y,
                          x + DOT,
                          y + DOT
                      ],
                      radius=4,
                      fill=color
                  )

              # ==========================
              # SNAKE BODY
              # ==========================

              body_length = 8

              start = max(
                  0,
                  step - body_length
              )

              body = []

              for i in range(start, step + 1):

                  row, col = path[i]

                  x, y = position(row, col)

                  body.append(
                      (
                          x + DOT // 2,
                          y + DOT // 2
                      )
                  )

              if len(body) > 1:

                  # Glow
                  draw.line(
                      body,
                      fill=SNAKE_GLOW,
                      width=13,
                      joint="curve"
                  )

                  # Main body
                  draw.line(
                      body,
                      fill=SNAKE,
                      width=7,
                      joint="curve"
                  )

              # ==========================
              # SNAKE HEAD
              # ==========================

              row, col = path[step]

              x, y = position(row, col)

              cx = x + DOT // 2
              cy = y + DOT // 2

              # Head glow
              draw.ellipse(
                  [
                      cx - 11,
                      cy - 11,
                      cx + 11,
                      cy + 11
                  ],
                  fill=SNAKE_GLOW
              )

              # Head
              draw.ellipse(
                  [
                      cx - 8,
                      cy - 8,
                      cx + 8,
                      cy + 8
                  ],
                  fill=SNAKE
              )

              # Eye
              draw.ellipse(
                  [
                      cx + 2,
                      cy - 4,
                      cx + 5,
                      cy - 1
                  ],
                  fill=(255, 255, 255)
              )

              # ==========================
              # PROGRESS BAR
              # ==========================

              bar_x = 45
              bar_y = 210
              bar_width = 1110
              bar_height = 6

              # Background
              draw.rounded_rectangle(
                  [
                      bar_x,
                      bar_y,
                      bar_x + bar_width,
                      bar_y + bar_height
                  ],
                  radius=3,
                  fill=(30, 35, 55)
              )

              # Progress
              progress = step / (len(path) - 1)

              current_width = int(
                  bar_width * progress
              )

              if current_width > 0:

                  draw.rounded_rectangle(
                      [
                          bar_x,
                          bar_y,
                          bar_x + current_width,
                          bar_y + bar_height
                      ],
                      radius=3,
                      fill=SNAKE
                  )

              frames.append(image)

          # ==============================
          # HOLD END
          # ==============================

          for _ in range(20):
              frames.append(frames[-1])

          # ==============================
          # SAVE
          # ==============================

          frames[0].save(
              "output/custom-snake.gif",
              save_all=True,
              append_images=frames[1:],
              duration=45,
              loop=0,
              optimize=True
          )

          print("DONE")
          print("Blocks eaten:", len(path))
          print("Frames:", len(frames))
          PY

          python snake.py

      - name: Save GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/custom-snake.gif

          git commit -m "Update colorful snake" || true

          git push
