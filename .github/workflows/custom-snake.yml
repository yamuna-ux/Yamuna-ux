name: Animated Contribution Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Generate snake GIF
        run: |
          mkdir -p output

          cat > generate_snake.py <<'PY'
          from PIL import Image, ImageDraw
          import math

          # ============================================================
          # BOX SETTINGS
          # ============================================================

          WIDTH = 1200
          HEIGHT = 280

          COLS = 48
          ROWS = 7

          DOT_SIZE = 15
          GAP_X = 8
          GAP_Y = 8

          START_X = 45
          START_Y = 55

          BG = (7, 12, 25)

          # Dark -> bright contribution colors
          COLORS = [
              (25, 22, 70),
              (49, 46, 129),
              (109, 40, 217),
              (6, 182, 212),
              (236, 72, 153),
          ]

          SNAKE_COLOR = (244, 114, 182)
          SNAKE_GLOW = (192, 132, 252)

          # ============================================================
          # CREATE GRID
          # ============================================================

          grid = []

          for row in range(ROWS):

              # Snake goes:
              # row 1 -> left to right
              # row 2 -> right to left
              # row 3 -> left to right
              # etc.

              if row % 2 == 0:
                  columns = range(COLS)
              else:
                  columns = range(COLS - 1, -1, -1)

              for col in columns:
                  grid.append((row, col))

          # ============================================================
          # POSITION OF EACH DOT
          # ============================================================

          def dot_position(row, col):
              x = START_X + col * (DOT_SIZE + GAP_X)
              y = START_Y + row * (DOT_SIZE + GAP_Y)

              return x, y

          # ============================================================
          # CREATE FRAMES
          # ============================================================

          frames = []

          # Frames per block
          FRAMES_PER_BLOCK = 3

          total_blocks = len(grid)

          for step in range(total_blocks + 25):

              img = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BG
              )

              draw = ImageDraw.Draw(img)

              # --------------------------------------------------------
              # DRAW ALL DOTS
              # --------------------------------------------------------

              for index, (row, col) in enumerate(grid):

                  x, y = dot_position(row, col)

                  # Already eaten
                  if index < step:

                      color = (13, 18, 32)

                  else:

                      # Make different colourful levels
                      level = (col + row * 2) % len(COLORS)

                      color = COLORS[level]

                  draw.rounded_rectangle(
                      [
                          x,
                          y,
                          x + DOT_SIZE,
                          y + DOT_SIZE
                      ],
                      radius=4,
                      fill=color
                  )

              # --------------------------------------------------------
              # SNAKE POSITION
              # --------------------------------------------------------

              if step < total_blocks:

                  current_row, current_col = grid[step]

                  head_x, head_y = dot_position(
                      current_row,
                      current_col
                  )

                  # ----------------------------------------------------
                  # SNAKE BODY
                  # ----------------------------------------------------

                  body = []

                  body_length = 7

                  start_index = max(
                      0,
                      step - body_length
                  )

                  for body_index in range(
                      start_index,
                      step + 1
                  ):

                      r, c = grid[body_index]

                      bx, by = dot_position(r, c)

                      body.append(
                          (
                              bx + DOT_SIZE // 2,
                              by + DOT_SIZE // 2
                          )
                      )

                  # Draw glow
                  if len(body) > 1:

                      draw.line(
                          body,
                          fill=SNAKE_GLOW,
                          width=12,
                          joint="curve"
                      )

                      draw.line(
                          body,
                          fill=SNAKE_COLOR,
                          width=7,
                          joint="curve"
                      )

                  # ----------------------------------------------------
                  # SNAKE HEAD
                  # ----------------------------------------------------

                  cx = head_x + DOT_SIZE // 2
                  cy = head_y + DOT_SIZE // 2

                  draw.ellipse(
                      [
                          cx - 10,
                          cy - 10,
                          cx + 10,
                          cy + 10
                      ],
                      fill=SNAKE_COLOR
                  )

                  # Head highlight
                  draw.ellipse(
                      [
                          cx - 5,
                          cy - 6,
                          cx + 5,
                          cy + 4
                      ],
                      fill=(255, 255, 255)
                  )

                  # Eyes
                  draw.ellipse(
                      [
                          cx + 1,
                          cy - 4,
                          cx + 4,
                          cy - 1
                      ],
                      fill=(30, 20, 50)
                  )

                  draw.ellipse(
                      [
                          cx + 1,
                          cy + 2,
                          cx + 4,
                          cy + 5
                      ],
                      fill=(30, 20, 50)
                  )

              # --------------------------------------------------------
              # PROGRESS BAR
              # --------------------------------------------------------

              bar_x = 45
              bar_y = 230

              bar_width = 1110
              bar_height = 5

              # Background bar
              draw.rounded_rectangle(
                  [
                      bar_x,
                      bar_y,
                      bar_x + bar_width,
                      bar_y + bar_height
                  ],
                  radius=3,
                  fill=(30, 35, 55)
              )

              # Progress
              progress = min(
                  step / total_blocks,
                  1
              )

              progress_width = int(
                  bar_width * progress
              )

              if progress_width > 0:

                  draw.rounded_rectangle(
                      [
                          bar_x,
                          bar_y,
                          bar_x + progress_width,
                          bar_y + bar_height
                      ],
                      radius=3,
                      fill=(236, 72, 153)
                  )

              frames.append(img)

          # ============================================================
          # HOLD LAST FRAME
          # ============================================================

          for _ in range(15):
              frames.append(frames[-1])

          # ============================================================
          # SAVE GIF
          # ============================================================

          frames[0].save(
              "output/custom-snake.gif",
              save_all=True,
              append_images=frames[1:],
              duration=70,
              loop=0,
              optimize=True
          )

          print("Snake generated successfully!")
          print("Blocks:", total_blocks)
          print("Frames:", len(frames))
          PY

          python generate_snake.py

      - name: Commit generated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/custom-snake.gif

          git commit -m "Update animated contribution snake" || echo "No changes"

          git push
