name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile statistics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: yamuna-ux

          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          config_display: large

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-contributions.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: yamuna-ux

          base: ""
          config_timezone: Asia/Kolkata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Commit generated images
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add assets/

          git diff --cached --quiet || git commit -m "Update GitHub profile statistics"

          git push
