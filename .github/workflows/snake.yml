name: Generate Colorful Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate colorful snake
        uses: Platane/snk@v3
        with:
          github_user_name: yamuna-ux
          outputs: |
            dist/yamuna-snake.svg?color_snake=7C3AED&color_dots=F1F5F9,DDD6FE,A78BFA,06B6D4,EC4899
            dist/yamuna-snake-dark.svg?color_snake=EC4899&color_dots=1E1B4B,4338CA,7C3AED,06B6D4,EC4899

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
