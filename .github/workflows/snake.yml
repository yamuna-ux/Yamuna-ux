name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate colorful contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: yamuna-ux
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-snake.gif?color_snake=EC4899&color_dots=FFFFFF,EDE9FE,C4B5FD,8B5CF6,7C3AED&color_background=FFFFFF
            dist/github-contribution-snake-dark.gif?color_snake=06B6D4&color_dots=161B22,312E81,4338CA,7C3AED,06B6D4&color_background=0D1117

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
