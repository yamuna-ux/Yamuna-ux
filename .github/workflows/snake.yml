# .github/workflows/snake.yml

name: Generate Colorful Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: yamuna-ux
          github_token: ${{ secrets.GITHUB_TOKEN }}

          outputs: |
            dist/github-contribution-snake.svg?color_snake=%23FFFFFF&color_dots=%23161B22,%23059669,%2339D353,%2356D364,%23A7F3D0
            dist/github-contribution-snake-dark.svg?color_snake=%23FFFFFF&color_dots=%230B1120,%23065F46,%23059669,%2339D353,%23A7F3D0

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
