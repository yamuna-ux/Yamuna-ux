name: Generate Colorful Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate colorful snake
        uses: Platane/snk@v3
        with:
          github_user_name: yamuna-ux
          github_token: ${{ secrets.GITHUB_TOKEN }}

          outputs: |
            dist/github-contribution-snake.svg?color_snake=#EC4899&color_dots=#161B22,#4C1D95,#7C3AED,#06B6D4,#EC4899
            dist/github-contribution-snake-dark.svg?color_snake=#A855F7&color_dots=#0F172A,#312E81,#7C3AED,#06B6D4,#EC4899

      - name: Publish colorful snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
