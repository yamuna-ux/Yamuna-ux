name: Generate Colorful Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate colorful snake
        uses: Platane/snk@v3
        with:
          github_user_name: yamuna-ux
          github_token: ${{ secrets.GITHUB_TOKEN }}

          outputs: |
            dist/github-contribution-snake.svg?color_snake=%23EC4899&color_dots=%230F172A,%23312E81,%237C3AED,%2306B6D4,%23EC4899
            dist/github-contribution-snake-dark.svg?color_snake=%23F472B6&color_dots=%230F172A,%234C1D95,%237C3AED,%2306B6D4,%23EC4899

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
