name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: yamuna-ux
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=7C3AED&color_dots=EEF2FF,C4B5FD,8B5CF6,06B6D4,EC4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=EC4899&color_dots=312E81,4F46E5,7C3AED,06B6D4,EC4899

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
